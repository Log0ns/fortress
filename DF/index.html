<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fortress</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; height: 100vh; overflow: hidden; font-family: monospace; }
    #sidebar {
      width: 200px; min-width: 200px; background: #1a1a1a; border-left: 1px solid #333;
      display: flex; flex-direction: column; color: #ccc; font-size: 13px; order: 2;
      overflow-y: auto;
    }
    #sidebar section { padding: 8px; border-bottom: 1px solid #333; }
    #sidebar h3 { color: #fa0; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    #sidebar .row { display: flex; justify-content: space-between; margin: 2px 0; }
    #sidebar .val { color: #fff; }
    #toolbar { display: flex; flex-direction: column; gap: 4px; }
    #toolbar button {
      background: #222; border: 1px solid #444; color: #ccc; padding: 5px 6px;
      font-family: monospace; font-size: 12px; cursor: pointer; text-align: left;
    }
    #toolbar button.active { background: #3a2800; border-color: #f80; color: #f80; }
    #toolbar button:hover { background: #2a2a2a; }
    #dwarf-list { display: flex; flex-direction: column; gap: 3px; }
    .dwarf-row {
      padding: 4px 6px; cursor: pointer; border: 1px solid transparent;
      display: flex; justify-content: space-between; align-items: center;
    }
    .dwarf-row:hover { background: #252525; }
    .dwarf-row.selected { border-color: #ff0; background: #2a2800; }
    .dwarf-row.dead { color: #555; }
    .dwarf-row .dname { color: #0f0; }
    .dwarf-row.dead .dname { color: #555; }
    .dwarf-row.selected .dname { color: #ff0; }
    .hunger-bar { width: 60px; height: 6px; background: #333; border-radius: 2px; overflow: hidden; }
    .hunger-fill { height: 100%; background: #4f4; transition: width 0.3s; }
    #dwarf-detail .stat-row { display: flex; justify-content: space-between; margin: 3px 0; }
    #dwarf-detail .bar { flex: 1; height: 8px; background: #333; border-radius: 2px; overflow: hidden; margin-left: 8px; }
    #dwarf-detail .bar-fill { height: 100%; border-radius: 2px; }
    #ui-message {
      display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #222; border: 1px solid #f80; color: #f80; padding: 6px 14px;
      font-family: monospace; font-size: 13px; z-index: 100; pointer-events: none;
    }
  </style>
</head>
<body>
<div id="ui-message"></div>
<canvas id="map"></canvas>
<div id="sidebar">
  <section>
    <h3>Fortress</h3>
    <div class="row"><span>Time</span><span class="val" id="ui-time">Y1 Spring</span></div>
    <div class="row"><span>Z-level</span><span class="val" id="ui-zlevel">0</span></div>
    <div class="row"><span>Biome</span><span class="val" id="ui-biome">-</span></div>
    <div class="row"><span>Dwarves</span><span class="val" id="ui-dwarves">7/7</span></div>
    <div class="row"><span>Tile</span><span class="val" id="ui-hover">-</span></div>
  </section>
  <section>
    <h3>Resources</h3>
    <div class="row"><span>&#9651; Wood</span><span class="val" id="ui-wood">0</span></div>
    <div class="row"><span>&#9733; Stone</span><span class="val" id="ui-stone">0</span></div>
    <div class="row"><span>&#9733; Dirt</span><span class="val" id="ui-dirt">0</span></div>
    <div class="row"><span>% Food</span><span class="val" id="ui-food">0</span></div>
    <div class="row"><span>&#9744; Farms</span><span class="val" id="ui-farms">0</span></div>
  </section>
  <section>
    <h3>Designate</h3>
    <div id="toolbar">
      <button id="btn-select"  onclick="setMode('select')">[V] Select</button>
      <button id="btn-dig"          onclick="setMode('dig')">[D] Dig</button>
      <button id="btn-dig-stair-dn" onclick="setMode('dig-stair-dn')">[&lt;] Dig Stair Down</button>
      <button id="btn-dig-stair-up" onclick="setMode('dig-stair-up')">[&gt;] Dig Stair Up</button>
      <button id="btn-chop"     onclick="setMode('chop')">[C] Chop</button>
      <button id="btn-destroy"   onclick="setMode('destroy')">[X] Destroy</button>
      <button id="btn-stock"    onclick="setMode('stock')">[S] Stockpile</button>
      <button id="btn-build" onclick="setMode('build')">[B] Build</button>
      <div id="build-submenu" style="display:none;flex-direction:column;gap:2px;margin-left:8px">
        <button id="btn-workshop"    onclick="setMode('workshop')">[B] Workshop</button>
        <button id="btn-stone-wall"  onclick="setMode('stone-wall')">[B] Stone Wall</button>
        <button id="btn-dirt-wall"   onclick="setMode('dirt-wall')">[B] Dirt Wall</button>
        <button id="btn-stone-floor" onclick="setMode('stone-floor')">[B] Stone Floor</button>
        <button id="btn-dirt-floor"  onclick="setMode('dirt-floor')">[B] Dirt Floor</button>
        <button id="btn-stair-up"    onclick="setMode('stair-up')">[B] Stair Up</button>
        <button id="btn-stair-dn"    onclick="setMode('stair-down')">[B] Stair Down</button>
        <button id="btn-door"        onclick="setMode('door')">[B] Door</button>
        <button id="btn-bed"         onclick="setMode('bed')">[B] Bed</button>
        <button id="btn-chair"       onclick="setMode('chair')">[B] Chair</button>
        <button id="btn-table"       onclick="setMode('table')">[B] Table</button>
        <button id="btn-chest"       onclick="setMode('chest')">[B] Chest</button>
        <button id="btn-barrel"      onclick="setMode('barrel')">[B] Barrel</button>
      </div>
      <button id="btn-farm"     onclick="setMode('farm')">[F] Farm Plot</button>
    </div>
  </section>
  <section>
    <h3>Save / Load</h3>
    <div style="display:flex;gap:4px">
      <button onclick="saveGame()" style="flex:1;background:#222;border:1px solid #444;color:#ccc;padding:5px;font-family:monospace;font-size:12px;cursor:pointer">&#128190; Save</button>
      <button onclick="loadGame()" style="flex:1;background:#222;border:1px solid #444;color:#ccc;padding:5px;font-family:monospace;font-size:12px;cursor:pointer">&#128194; Load</button>
    </div>
    <div id="ui-save-status" style="font-size:11px;color:#888;margin-top:4px"></div>
  </section>
  <section>
    <h3>Dwarves</h3>
    <div id="dwarf-list"></div>
  </section>
  <section id="dwarf-detail" style="display:none">
    <h3 id="detail-name"></h3>
    <div class="stat-row"><span>Job</span><span class="val" id="detail-job"></span></div>
    <div class="stat-row">
      <span>Health</span>
      <div class="bar"><div class="bar-fill" id="detail-health-bar" style="background:#f44"></div></div>
    </div>
  </section>
</div>

<!-- load order matters: engine → state → jobs → entities → render → ui → save → main -->
<script src="js/engine.js"></script>
<script src="js/state.js"></script>
<script src="js/jobs.js"></script>
<script src="js/entities.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/save.js"></script>
<script src="js/main.js"></script>
</body>
</html>
